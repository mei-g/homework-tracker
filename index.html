DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeroom — Homework Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #40E0D0;
    --panel: #FFFFFF;
    --ink: #22303F;
    --ink-soft: #5B6B78;
    --line: #DDE3DE;
    --amber: #E3A008;
    --teal: #2A8C82;
    --coral: #E0603F;
    --violet: #6A4C93;
    --moss: #3A7D44;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  header.top h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header.top p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* Child tabs, styled like folder tabs along a shelf */
  .kids-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .kids-row::-webkit-scrollbar { display: none; }

  .kid-tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .kid-tab.active {
    border-color: var(--kid-color, var(--ink));
    color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--kid-color, var(--ink));
  }

  .kid-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--kid-color, var(--ink-soft));
    flex-shrink: 0;
  }

  .kid-ring-num {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .add-kid-tab {
    flex: 0 0 auto;
    padding: 10px 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
  }

  .overall {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .overall .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .overall .row h2 { font-size: 17px; margin: 0; }
  .overall .row .pct { font-size: 17px; font-weight: 600; color: var(--kid-color, var(--ink)); }

  .bar-track {
    height: 8px;
    background: var(--paper);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--kid-color, var(--ink));
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .subjects { display: flex; flex-direction: column; gap: 16px; }

  .practice-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--ink);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
    margin-bottom: 16px;
  }
  .practice-head {

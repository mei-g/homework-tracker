<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeroom — Homework Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #40E0D0;
    --panel: #FFFFFF;
    --ink: #22303F;
    --ink-soft: #5B6B78;
    --line: #DDE3DE;
    --amber: #E3A008;
    --teal: #2A8C82;
    --coral: #E0603F;
    --violet: #6A4C93;
    --moss: #3A7D44;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  header.top h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header.top p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* Child tabs, styled like folder tabs along a shelf */
  .kids-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .kid-finder-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .kid-filter {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 13.5px;
    font-family: inherit;
    background: var(--panel);
  }
  .kid-jump {
    flex: 0 0 auto;
    max-width: 44%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 13.5px;
    font-family: inherit;
    background: var(--panel);
    color: var(--ink);
  }

  .kid-tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .kid-tab.active {
    border-color: var(--kid-color, var(--ink));
    color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--kid-color, var(--ink));
  }

  .kid-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--kid-color, var(--ink-soft));
    flex-shrink: 0;
  }

  .kid-del {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 0 0 0 2px;
  }
  .kid-del:hover { color: var(--coral); }

  .kid-ring-num {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .add-kid-tab {
    flex: 0 0 auto;
    padding: 10px 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
  }

  .overall {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .overall .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .overall .row h2 { font-size: 17px; margin: 0; }
  .overall .row .pct { font-size: 17px; font-weight: 600; color: var(--kid-color, var(--ink)); }

  .bar-track {
    height: 8px;
    background: var(--paper);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--kid-color, var(--ink));
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .subjects { display: flex; flex-direction: column; gap: 16px; }

  .practice-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--ink);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
    margin-bottom: 16px;
  }
  .practice-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .practice-head h3 { font-size: 15px; margin: 0; }
  .practice-total { font-size: 13px; color: var(--ink-soft); }
  .practice-goal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--paper);
  }
  .practice-week-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .practice-week-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .planned-ahead {
    font-size: 11.5px;
    color: var(--moss);
    background: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .add-week-btn {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .practice-week-title {
    font-size: 13.5px;
    font-weight: 600;
  }
  .week-card { margin-bottom: 14px; }
  .week-stats-row {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .week-stat {
    flex: 1;
    background: var(--paper);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .week-stat-label {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .week-stat-value {
    font-size: 17px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  .week-start-input {
    padding: 4px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--ink-soft);
  }
  .practice-goal-label { font-size: 12.5px; color: var(--ink-soft); }
  .edit-goal-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 12px;
    font-weight: 500;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .auto-tag {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .02em;
    color: var(--ink-soft);
    background: var(--paper);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .practice-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid var(--paper);
    font-size: 14px;
  }
  .practice-entry input[type="checkbox"] {
    width: 17px; height: 17px;
    accent-color: var(--ink);
    cursor: pointer;
    flex-shrink: 0;
  }
  .practice-entry.done .inst {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .practice-entry:first-of-type { border-top: none; }
  .practice-entry .inst { flex: 1; }
  .practice-entry .mins { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
  .practice-entry .actual-input {
    width: 56px;
    padding: 3px 5px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--ink);
    text-align: center;
  }
  .practice-entry .actual-input::placeholder { color: var(--ink-soft); }
  .practice-entry .pdate { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .practice-entry .entry-date {
    color: var(--ink-soft);
    font-size: 11.5px;
    white-space: nowrap;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 4px;
    font-family: inherit;
    background: transparent;
  }
  .practice-entry .entry-date:hover,
  .practice-entry .entry-date:focus {
    border-color: var(--line);
    background: var(--panel);
  }
  .practice-add-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .practice-add-row input[type="text"] {
    flex: 1 1 110px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .practice-add-row input[type="number"] {
    flex: 0 0 80px;
    padding: 8px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
  }
  .practice-add-row input[type="date"] {
    flex: 0 0 130px;
    padding: 8px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink-soft);
  }
  .practice-add-row button {
    flex: 0 0 auto;
    padding: 8px 14px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }

  .subject {
    position: relative;
    margin-top: 14px;
  }

  .subject-tab {
    position: absolute;
    top: -14px;
    left: 14px;
    padding: 4px 12px 3px;
    background: var(--subj-color);
    color: white;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 6px 6px 0 0;
  }

  .subject-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--subj-color);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
  }

  .subject-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .subject-head .frac {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .subject-del {
    margin-left: 10px;
    font-size: 12px;
    white-space: nowrap;
  }

  .assignment {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--paper);
  }
  .assignment:first-of-type { border-top: none; }

  .assignment input[type="checkbox"] {
    margin-top: 3px;
    width: 17px; height: 17px;
    accent-color: var(--subj-color);
    cursor: pointer;
    flex-shrink: 0;
  }

  .assignment .title {
    font-size: 14.5px;
    line-height: 1.35;
  }
  .assignment.done .title {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .assignment .due {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .assignment .due.overdue { color: var(--coral); font-weight: 500; }

  .assignment .del {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
  }

  .add-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .add-row input[type="text"] {
    flex: 1 1 140px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .add-row input[type="date"] {
    flex: 0 0 130px;
    padding: 8px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink-soft);
  }
  .add-row button {
    flex: 0 0 auto;
    padding: 8px 14px;
    background: var(--subj-color, var(--ink));
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }

  .add-subject-btn {
    width: 100%;
    padding: 12px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(34,48,63,0.35);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    background: var(--panel);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal input[type="text"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .swatches { display: flex; gap: 8px; margin-bottom: 14px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected { border-color: var(--ink); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13.5px;
    border: none;
    cursor: pointer;
  }
  .btn-cancel { background: var(--paper); color: var(--ink-soft); }
  .btn-save { background: var(--ink); color: white; }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .role-badge {
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    background: var(--paper);
    color: var(--ink);
  }
  .role-badge.admin { background: var(--teal); color: white; }
  .signout-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .error-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #FBEAE5;
    border: 1px solid var(--coral);
    color: #9A3B23;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .error-banner button {
    background: none;
    border: none;
    color: #9A3B23;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }

  .auth-wrap {
    max-width: 340px;
    margin: 60px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
  }
  .auth-wrap h1 { font-size: 20px; margin: 0 0 4px; }
  .auth-wrap p.sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 18px; }
  .auth-wrap input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .auth-wrap button.primary {
    width: 100%;
    padding: 10px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }
  .auth-error { color: var(--coral); font-size: 12.5px; margin: -4px 0 10px; }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
  .auth-toggle a { color: var(--ink); cursor: pointer; text-decoration: underline; }
</style>

<body>
<div class="app" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
const COLORS = ['#E3A008', '#2A8C82', '#E0603F', '#6A4C93', '#3A7D44', '#2E5EAA'];
const STORAGE_KEY = 'homeroom-data';

// --- Backend setup ---
// Fill these in with your own Firebase project's config (see deployment steps).
// Until you do, the app falls back to Claude's built-in storage for this preview,
// and access control is skipped (you're treated as a single local admin).
const firebaseConfig = {
  apiKey: "AIzaSyCOY7Y-Ul3SmhO8BKLnik1k31KAq77rdWQ",
  authDomain: "homework-tracker-58087.firebaseapp.com",
  projectId: "homework-tracker-58087",
  storageBucket: "homework-tracker-58087.firebasestorage.app",
  messagingSenderId: "896517151831",
  appId: "1:896517151831:web:21c67d998d5fe4cab91712",
  measurementId: "G-1LL49KXYEQ"
};

const USE_FIREBASE = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
let auth = null;

let state = { children: [], activeChildId: null };
let modal = null; // { type: 'child' | 'subject' | 'deleteChild', childId? }

// Auth/role state
let currentUser = null;      // Firebase user object, or null
let currentRole = null;      // 'admin' | 'guest' | null
let authMode = 'signin';     // 'signin' | 'signup'
let authError = '';
let authBusy = false;
let saveError = ''; // shown as a dismissable banner when a Firestore write fails
let childFilter = ''; // free-text filter for the child tabs, useful once there are many children

function dismissSaveError() { saveError = ''; render(); }

function uid() { return Math.random().toString(36).slice(2, 10); }

// Structural changes (add/delete a child or subject, delete a logged item,
// edit a logged item's date, edit the weekly goal or week-start) are
// admin-only. Guests can only tick things off and log new items — enforced
// both here in the UI and, best-effort, in Firestore rules.

// Only an admin (or the local single-user fallback) can change practice goals.
// Admin can manage any child; a guest can fully manage children they added
// themselves (add/delete the child, its subjects, assignments, practice
// items, dates, and goal) but not anyone else's.
function canManageChild(child) {
  if (!USE_FIREBASE) return true;
  if (currentRole === 'admin') return true;
  return !!child && child.ownerId === (currentUser && currentUser.uid);
}

function isAdminOrLocal() {
  return !USE_FIREBASE || currentRole === 'admin';
}

// Returns the Date (midnight) that this child's current week starts on.
// The weekday used as "start of week" comes from child.weekStart (an anchor
// date an admin can pick); defaults to Sunday if never set.
function getWeekStartDate(child, refDate = new Date()) {
  const anchorWeekday = child.weekStart ? new Date(child.weekStart + 'T00:00:00').getDay() : 0;
  const d = new Date(refDate);
  d.setHours(0, 0, 0, 0);
  let diff = d.getDay() - anchorWeekday;
  if (diff < 0) diff += 7;
  d.setDate(d.getDate() - diff);
  return d;
}

// Stable key identifying a child's current week (the date it starts on).
function weekKeyFor(child, refDate = new Date()) {
  return getWeekStartDate(child, refDate).toISOString().slice(0, 10);
}

// ISO-8601 week number, for the "Week N" label.
function isoWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

// Makes sure this child has enough auto-generated practice items for the
// current week, based on their practice goal. Returns true if it added any
// (so the caller knows whether to persist the change).
function ensureWeeklyDefaults(child) {
  if (!child.practiceGoal) child.practiceGoal = { minutes: 30, timesPerWeek: 1 };
  if (!child.practiceLog) child.practiceLog = [];
  const wk = weekKeyFor(child);
  const existing = child.practiceLog.filter(e => e.auto && e.weekKey === wk).length;
  const need = child.practiceGoal.timesPerWeek - existing;
  let changed = false;
  for (let i = 0; i < need; i++) {
    child.practiceLog.push({
      id: uid(),
      instrument: 'Practice',
      minutes: child.practiceGoal.minutes,
      actualMinutes: null,
      date: wk,
      done: false,
      auto: true,
      weekKey: wk
    });
    changed = true;
  }
  return changed;
}

// Called right after an admin edits the goal (or moves the week-start
// anchor): drops this week's not-yet-done auto items and rebuilds them to
// match, leaving already-completed sessions untouched.
function regenerateWeeklyDefaults(child) {
  const wk = weekKeyFor(child);
  child.practiceLog = child.practiceLog.filter(e => !(e.auto && e.weekKey === wk && !e.done));
  const doneCount = child.practiceLog.filter(e => e.auto && e.weekKey === wk && e.done).length;
  const need = Math.max(0, child.practiceGoal.timesPerWeek - doneCount);
  for (let i = 0; i < need; i++) {
    child.practiceLog.push({
      id: uid(),
      instrument: 'Practice',
      minutes: child.practiceGoal.minutes,
      actualMinutes: null,
      date: wk,
      done: false,
      auto: true,
      weekKey: wk
    });
  }
}

// Fetch (or create) this user's role doc. The first person ever to sign up
// becomes admin automatically; everyone after that starts as a guest.
// An admin can promote other users later from the Firestore console
// (users/{uid}.role) if needed.
async function ensureUserRole(user) {
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if (snap.exists) {
    currentRole = snap.data().role || 'guest';
    return;
  }
  const anyUsers = await db.collection('users').limit(1).get();
  const role = anyUsers.empty ? 'admin' : 'guest';
  await ref.set({ role, email: user.email || '' });
  currentRole = role;
}

async function loadChildrenFirestore() {
  const query = (currentRole === 'admin')
    ? db.collection('children')
    : db.collection('children').where('ownerId', '==', currentUser.uid);
  const snap = await query.get();
  state.children = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  for (const child of state.children) {
    if (ensureWeeklyDefaults(child)) {
      await persistChild(child);
    }
  }
  if (!state.activeChildId || !state.children.find(c => c.id === state.activeChildId)) {
    state.activeChildId = state.children.length ? state.children[0].id : null;
  }
}

// Persist a single child (create or update). Falls back to saving the
// whole local blob when Firebase isn't configured.
async function persistChild(child) {
  if (USE_FIREBASE) {
    try {
      await db.collection('children').doc(child.id).set({
        ownerId: child.ownerId,
        name: child.name,
        color: child.color,
        subjects: child.subjects,
        practiceLog: child.practiceLog || [],
        practiceGoal: child.practiceGoal || { minutes: 30, timesPerWeek: 1 },
        weekStart: child.weekStart || null
      }, { merge: true });
      saveError = '';
    } catch (e) {
      console.error('Save child error', e);
      saveError = 'Couldn\'t save that change: ' + (e && e.message ? e.message : 'unknown error');
      render();
    }
  } else {
    await saveLocal();
  }
}

async function removeChildDoc(id) {
  if (USE_FIREBASE) {
    try {
      await db.collection('children').doc(id).delete();
    } catch (e) {
      console.error('Delete child error', e);
    }
  } else {
    await saveLocal();
  }
}

// Local (non-Firebase) fallback: whole-state save via Claude's storage.
async function saveLocal() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) {
    console.error('Storage error', e);
  }
}

async function loadLocal() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value) state = JSON.parse(res.value);
  } catch (e) {
    // no data yet
  }
  let anyChanged = false;
  state.children.forEach(child => {
    if (ensureWeeklyDefaults(child)) anyChanged = true;
  });
  if (anyChanged) await saveLocal();
  if (!state.activeChildId && state.children.length) {
    state.activeChildId = state.children[0].id;
  }
  render();
}

// --- Auth handlers ---
async function handleAuthSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) return;
  authError = '';
  authBusy = true;
  render();
  try {
    if (authMode === 'signup') {
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged will take it from here
  } catch (e) {
    authError = e.message.replace(/^Firebase:\s*/, '');
  }
  authBusy = false;
  render();
}

function toggleAuthMode() {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  authError = '';
  render();
}

function signOutUser() {
  auth.signOut();
}

// --- Boot ---
if (USE_FIREBASE) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user) {
      try {
        await ensureUserRole(user);
        await loadChildrenFirestore();
      } catch (e) {
        console.error('Auth/role error', e);
      }
    } else {
      currentRole = null;
      state = { children: [], activeChildId: null };
    }
    render();
  });
} else {
  loadLocal();
}

function activeChild() {
  return state.children.find(c => c.id === state.activeChildId) || null;
}

function subjectProgress(subject) {
  const total = subject.assignments.length;
  const done = subject.assignments.filter(a => a.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function childProgress(child) {
  let total = 0, done = 0;
  child.subjects.forEach(s => {
    total += s.assignments.length;
    done += s.assignments.filter(a => a.done).length;
  });
  (child.practiceLog || []).forEach(e => {
    total += 1;
    if (e.done) done += 1;
  });
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function weekPracticeMinutes(child) {
  const log = child.practiceLog || [];
  const startOfWeek = getWeekStartDate(child);
  return log.reduce((sum, e) => {
    if (!e.date || !e.done) return sum;
    const d = new Date(e.date + 'T00:00:00');
    if (d < startOfWeek) return sum;
    const amount = (e.actualMinutes !== null && e.actualMinutes !== undefined && e.actualMinutes !== '') ? Number(e.actualMinutes) : e.minutes;
    return sum + amount;
  }, 0);
}

function addPracticeEntry(instInput, minsInput, dateInput) {
  const instrument = instInput.value.trim();
  const minutes = parseInt(minsInput.value, 10);
  if (!instrument || !minutes || minutes <= 0) return;
  const child = activeChild();
  if (!child.practiceLog) child.practiceLog = [];
  child.practiceLog.push({ id: uid(), instrument, minutes, actualMinutes: minutes, date: dateInput.value || new Date().toISOString().slice(0,10), done: false });
  instInput.value = ''; minsInput.value = ''; dateInput.value = '';
  persistChild(child); render();
}

function togglePracticeEntry(entryId) {
  const child = activeChild();
  const e = child.practiceLog.find(e => e.id === entryId);
  e.done = !e.done;
  persistChild(child); render();
}

function updateActualMinutes(entryId, value) {
  const child = activeChild();
  if (!child) return;
  const e = child.practiceLog.find(e => e.id === entryId);
  if (!e) return;
  if (value === '' || value === null) {
    e.actualMinutes = null;
  } else {
    const n = parseInt(value, 10);
    if (isNaN(n) || n < 0) return;
    e.actualMinutes = n;
  }
  persistChild(child); render();
}

function deletePracticeEntry(entryId) {
  const child = activeChild();
  if (!child || !canManageChild(child)) return;
  child.practiceLog = child.practiceLog.filter(e => e.id !== entryId);
  persistChild(child); render();
}

function handleAddPracticeClick() {
  const row = document.getElementById('practice-add-row');
  const instInput = row.querySelector('input[type=text]');
  const minsInput = row.querySelector('input[type=number]');
  const dateInput = row.querySelector('input[type=date]');
  addPracticeEntry(instInput, minsInput, dateInput);
}

function isOverdue(dueDate, done) {
  if (!dueDate || done) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(dueDate) < today;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// ---- actions ----
function confirmDeleteChild(id) {
  const child = state.children.find(c => c.id === id);
  if (!child || !canManageChild(child)) return;
  modal = { type: 'deleteChild', childId: id, name: child.name };
  render();
}

function performDeleteChild() {
  const id = modal.childId;
  state.children = state.children.filter(c => c.id !== id);
  if (state.activeChildId === id) {
    state.activeChildId = state.children.length ? state.children[0].id : null;
  }
  modal = null;
  removeChildDoc(id); render();
}

function confirmDeleteSubject(subjectId) {
  const child = activeChild();
  if (!child || !canManageChild(child)) return;
  const subject = child.subjects.find(s => s.id === subjectId);
  if (!subject) return;
  modal = { type: 'deleteSubject', childId: child.id, subjectId, name: subject.name };
  render();
}

function performDeleteSubject() {
  const child = state.children.find(c => c.id === modal.childId);
  if (!child || !canManageChild(child)) { modal = null; render(); return; }
  child.subjects = child.subjects.filter(s => s.id !== modal.subjectId);
  modal = null;
  persistChild(child); render();
}

function selectChild(id) { state.activeChildId = id; render(); }

// Filters the child tabs live as you type, without a full re-render (which
// would otherwise steal focus from the input on every keystroke). Scales
// fine to a couple hundred children since it's just DOM show/hide.
function updateChildFilter(value) {
  childFilter = value;
  const needle = value.trim().toLowerCase();
  document.querySelectorAll('.kid-tab').forEach(el => {
    const name = el.getAttribute('data-name') || '';
    el.style.display = (!needle || name.includes(needle)) ? '' : 'none';
  });
}

function openAddChild() { modal = { type: 'child', name: '', color: COLORS[state.children.length % COLORS.length] }; render(); }
function openAddSubject() { if (!canManageChild(activeChild())) return; modal = { type: 'subject', name: '', color: COLORS[(activeChild()?.subjects.length || 0) % COLORS.length] }; render(); }
function closeModal() { modal = null; render(); }

function saveModal() {
  if (!modal.name.trim()) return;
  if (modal.type === 'subject' && !canManageChild(activeChild())) { modal = null; render(); return; }
  if (modal.type === 'child') {
    const child = {
      id: uid(),
      name: modal.name.trim(),
      color: modal.color,
      subjects: [],
      practiceLog: [],
      practiceGoal: { minutes: 30, timesPerWeek: 1 },
      ownerId: USE_FIREBASE ? currentUser.uid : 'local'
    };
    ensureWeeklyDefaults(child);
    state.children.push(child);
    state.activeChildId = child.id;
    modal = null;
    persistChild(child); render();
    return;
  } else if (modal.type === 'subject') {
    const child = activeChild();
    if (child) {
      child.subjects.push({ id: uid(), name: modal.name.trim(), color: modal.color, assignments: [] });
      modal = null;
      persistChild(child); render();
      return;
    }
  }
  modal = null;
  render();
}

function openEditGoal(childId) {
  const child = state.children.find(c => c.id === childId);
  if (!child || !canManageChild(child)) return;
  if (!child.practiceGoal) child.practiceGoal = { minutes: 30, timesPerWeek: 1 };
  modal = { type: 'practiceGoal', childId, minutes: child.practiceGoal.minutes, timesPerWeek: child.practiceGoal.timesPerWeek };
  render();
}

function saveGoalModal() {
  const child = state.children.find(c => c.id === modal.childId);
  const minutes = parseInt(modal.minutes, 10);
  const timesPerWeek = parseInt(modal.timesPerWeek, 10);
  if (!child || !canManageChild(child) || !minutes || minutes <= 0 || !timesPerWeek || timesPerWeek <= 0) return;
  child.practiceGoal = { minutes, timesPerWeek };
  regenerateWeeklyDefaults(child);
  modal = null;
  persistChild(child); render();
}

// Lets an admin/owner queue up the next week's practice goal items ahead of
// time, instead of waiting for the calendar to roll over. Finds the
// furthest-out week already queued (or the current week if none), and adds
// one more week's worth of items after that.
function addNextWeek(childId) {
  const child = state.children.find(c => c.id === childId);
  if (!child || !canManageChild(child)) return;
  if (!child.practiceGoal) child.practiceGoal = { minutes: 30, timesPerWeek: 1 };
  if (!child.practiceLog) child.practiceLog = [];

  const currentWk = weekKeyFor(child);
  let latestWk = currentWk;
  child.practiceLog.forEach(e => {
    if (e.auto && e.weekKey && e.weekKey > latestWk) latestWk = e.weekKey;
  });

  const nextDate = new Date(latestWk + 'T00:00:00');
  nextDate.setDate(nextDate.getDate() + 7);
  const nextWk = nextDate.toISOString().slice(0, 10);

  for (let i = 0; i < child.practiceGoal.timesPerWeek; i++) {
    child.practiceLog.push({
      id: uid(),
      instrument: 'Practice',
      minutes: child.practiceGoal.minutes,
      actualMinutes: null,
      date: nextWk,
      done: false,
      auto: true,
      weekKey: nextWk
    });
  }
  persistChild(child); render();
}

// Admin picks which date the week should be considered to start on; that
// date's weekday becomes the recurring anchor (e.g. picking a Monday makes
// every week start on Monday from then on).
function updateWeekStart(childId, value) {
  const child = state.children.find(c => c.id === childId);
  if (!child || !canManageChild(child) || !value) return;
  child.weekStart = value;
  regenerateWeeklyDefaults(child);
  persistChild(child); render();
}

function updateEntryDate(entryId, value) {
  const child = activeChild();
  if (!child || !canManageChild(child) || !value) return;
  const e = child.practiceLog.find(e => e.id === entryId);
  if (!e) return;
  e.date = value;
  persistChild(child); render();
}

function addAssignment(subjectId, titleInput, dateInput) {
  const title = titleInput.value.trim();
  if (!title) return;
  const child = activeChild();
  const subject = child.subjects.find(s => s.id === subjectId);
  subject.assignments.push({ id: uid(), title, dueDate: dateInput.value || '', done: false });
  titleInput.value = ''; dateInput.value = '';
  persistChild(child); render();
}

function toggleAssignment(subjectId, assignmentId) {
  const child = activeChild();
  const subject = child.subjects.find(s => s.id === subjectId);
  const a = subject.assignments.find(a => a.id === assignmentId);
  a.done = !a.done;
  persistChild(child); render();
}

function deleteAssignment(subjectId, assignmentId) {
  const child = activeChild();
  if (!child || !canManageChild(child)) return;
  const subject = child.subjects.find(s => s.id === subjectId);
  subject.assignments = subject.assignments.filter(a => a.id !== assignmentId);
  persistChild(child); render();
}

// ---- render ----
function render() {
  const app = document.getElementById('app');

  if (USE_FIREBASE && !currentUser) {
    app.innerHTML = renderAuthScreen();
    return;
  }

  const child = activeChild();

  const accountHtml = USE_FIREBASE ? `
    <div class="header-meta">
      <span class="role-badge ${currentRole === 'admin' ? 'admin' : ''}">${currentRole}</span>
      <button class="signout-btn" onclick="signOutUser()">Sign out</button>
    </div>
  ` : '';

  let html = `
    <header class="top">
      <div>
        <h1>Homeroom</h1>
        <p>${currentRole === 'admin' ? 'Track assignments across every child.' : 'Track assignments for the children you\'ve added.'}</p>
      </div>
      ${accountHtml}
    </header>

    ${saveError ? `
      <div class="error-banner">
        <span>${escapeHtml(saveError)}</span>
        <button onclick="dismissSaveError()" title="Dismiss">×</button>
      </div>
    ` : ''}

    ${state.children.length >= 7 ? `
      <div class="kid-finder-row">
        <input type="text" class="kid-filter" placeholder="Filter children by name…" value="${escapeHtml(childFilter)}" oninput="updateChildFilter(this.value)">
        <select class="kid-jump" onchange="if(this.value) selectChild(this.value)">
          <option value="">Jump to child…</option>
          ${state.children.map(c => `<option value="${c.id}" ${c.id === state.activeChildId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </div>
    ` : ''}

    <div class="kids-row">
      ${state.children.filter(c => !childFilter || c.name.toLowerCase().includes(childFilter.toLowerCase())).map(c => {
        const p = childProgress(c);
        const delBtn = canManageChild(c)
          ? `<button class="kid-del" title="Delete ${escapeHtml(c.name)}" onclick="event.stopPropagation(); confirmDeleteChild('${c.id}')">×</button>`
          : '';
        return `<div class="kid-tab ${c.id === state.activeChildId ? 'active' : ''}" style="--kid-color:${c.color}" data-name="${escapeHtml(c.name.toLowerCase())}" onclick="selectChild('${c.id}')">
          <span class="kid-dot"></span>${escapeHtml(c.name)}
          <span class="kid-ring-num">${p.done}/${p.total}</span>
          ${delBtn}
        </div>`;
      }).join('')}
      <button class="add-kid-tab" onclick="openAddChild()">+ Add child</button>
    </div>
  `;

  if (!child) {
    html += `<div class="empty">Add a child to start tracking homework.</div>`;
  } else {
    const cp = childProgress(child);
    html += `
      <div class="overall" style="--kid-color:${child.color}">
        <div class="row"><h2>${escapeHtml(child.name)}'s overall progress</h2><span class="pct">${cp.pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${cp.pct}%"></div></div>
      </div>

      ${renderWeekCard(child)}

      ${renderPractice(child)}

      <div class="subjects">
        ${child.subjects.map(s => renderSubject(s)).join('')}
      </div>

      ${canManageChild(child) ? `<button class="add-subject-btn" onclick="openAddSubject()">+ Add subject</button>` : ''}
    `;
  }

  if (modal) html += renderModal();

  app.innerHTML = html;

  // wire up date min for new inputs not needed; wire enter key handlers
  document.querySelectorAll('.add-row input[type=text]').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const btn = inp.closest('.add-row').querySelector('button');
        btn.click();
      }
    });
  });
}

function renderAuthScreen() {
  const isSignup = authMode === 'signup';
  return `
    <div class="auth-wrap">
      <h1>Homeroom</h1>
      <p class="sub">${isSignup ? 'Create an account to start tracking.' : 'Sign in to see your homework tracker.'}</p>
      ${authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : ''}
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-password" placeholder="Password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" onkeydown="if(event.key==='Enter') handleAuthSubmit()">
      <button class="primary" onclick="handleAuthSubmit()" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Please wait…' : (isSignup ? 'Create account' : 'Sign in')}</button>
      <div class="auth-toggle">
        ${isSignup ? 'Already have an account?' : "Don't have an account?"}
        <a onclick="toggleAuthMode()">${isSignup ? 'Sign in' : 'Sign up'}</a>
      </div>
    </div>
  `;
}

function totalPracticeMinutes(child) {
  return (child.practiceLog || []).reduce((sum, e) => {
    if (!e.done) return sum;
    const amount = (e.actualMinutes !== null && e.actualMinutes !== undefined && e.actualMinutes !== '') ? Number(e.actualMinutes) : e.minutes;
    return sum + amount;
  }, 0);
}

function fmtDuration(totalMins) {
  const hrs = Math.floor(totalMins / 60), mins = totalMins % 60;
  return hrs ? `${hrs}h ${mins}m` : `${mins}m`;
}

function renderWeekCard(child) {
  const canEdit = canManageChild(child);
  const weekStartDate = getWeekStartDate(child);
  const weekStartKey = weekStartDate.toISOString().slice(0, 10);
  const weekNum = isoWeekNumber(weekStartDate);
  const weekPicker = canEdit
    ? `<input type="date" class="week-start-input" value="${weekStartKey}" onchange="updateWeekStart('${child.id}', this.value)">`
    : `<span class="practice-goal-label">Starts ${formatDate(weekStartKey)}</span>`;

  const futureWeeks = new Set(
    (child.practiceLog || []).filter(e => e.auto && e.weekKey && e.weekKey > weekStartKey).map(e => e.weekKey)
  ).size;
  const plannedAhead = futureWeeks
    ? `<span class="planned-ahead">${futureWeeks} week${futureWeeks > 1 ? 's' : ''} planned ahead</span>`
    : '';
  const addWeekBtn = canEdit
    ? `<button class="add-week-btn" onclick="addNextWeek('${child.id}')" title="Queue up next week's practice goal now">+ Add week</button>`
    : '';

  return `
    <div class="practice-card week-card">
      <div class="practice-head">
        <h3>Week ${weekNum}</h3>
      </div>
      <div class="practice-week-row">
        <div class="practice-week-left">
          ${weekPicker}
          ${plannedAhead}
        </div>
        ${addWeekBtn}
      </div>
      <div class="week-stats-row">
        <div class="week-stat">
          <span class="week-stat-label">This week</span>
          <span class="week-stat-value">${fmtDuration(weekPracticeMinutes(child))}</span>
        </div>
        <div class="week-stat">
          <span class="week-stat-label">Overall</span>
          <span class="week-stat-value">${fmtDuration(totalPracticeMinutes(child))}</span>
        </div>
      </div>
    </div>
  `;
}

function renderPractice(child) {
  const log = [...(child.practiceLog || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const goal = child.practiceGoal || { minutes: 30, timesPerWeek: 1 };
  const goalLabel = `Goal: ${goal.timesPerWeek}× ${goal.minutes} min / week`;
  const canEdit = canManageChild(child);
  const editBtn = canEdit ? `<button class="edit-goal-btn" onclick="openEditGoal('${child.id}')">Edit goal</button>` : '';

  return `
    <div class="practice-card">
      <div class="practice-head">
        <h3>Instrument practice</h3>
      </div>
      <div class="practice-goal-row">
        <span class="practice-goal-label">${goalLabel}</span>
        ${editBtn}
      </div>
      ${log.map(e => `
        <div class="practice-entry ${e.done ? 'done' : ''}">
          <input type="checkbox" ${e.done ? 'checked' : ''} onchange="togglePracticeEntry('${e.id}')">
          <span class="inst">${escapeHtml(e.instrument)}${e.auto ? '<span class="auto-tag">Weekly goal</span>' : ''}</span>
          <span class="mins">${e.auto ? 'Goal ' : ''}${e.minutes}m</span>
          <input type="number" class="actual-input" min="0" placeholder="Actual" title="Actual minutes practiced" value="${e.actualMinutes ?? ''}" onchange="updateActualMinutes('${e.id}', this.value)">
          ${canEdit
            ? `<input type="date" class="entry-date" value="${e.date || ''}" onchange="updateEntryDate('${e.id}', this.value)">`
            : `<span class="pdate">${formatDate(e.date)}</span>`}
          ${canEdit ? `<button class="del" onclick="deletePracticeEntry('${e.id}')">Remove</button>` : ''}
        </div>
      `).join('') || '<div style="color:var(--ink-soft); font-size:13.5px; padding:6px 0;">No practice logged yet.</div>'}
      <div class="practice-add-row" id="practice-add-row">
        <input type="text" placeholder="Instrument">
        <input type="number" placeholder="Min" min="1">
        <input type="date">
        <button onclick="handleAddPracticeClick()">Log</button>
      </div>
    </div>
  `;
}

function renderSubject(subject) {
  const p = subjectProgress(subject);
  const sorted = [...subject.assignments].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (a.dueDate || '9999').localeCompare(b.dueDate || '9999');
  });

  return `
    <div class="subject" style="--subj-color:${subject.color}">
      <div class="subject-tab">${escapeHtml(subject.name)}</div>
      <div class="subject-card">
        <div class="subject-head">
          <div class="bar-track" style="flex:1; margin-right:12px;"><div class="bar-fill" style="width:${p.pct}%; background:${subject.color}"></div></div>
          <span class="frac">${p.done}/${p.total}</span>
          ${canManageChild(activeChild()) ? `<button class="del subject-del" title="Delete ${escapeHtml(subject.name)}" onclick="confirmDeleteSubject('${subject.id}')">Remove subject</button>` : ''}
        </div>
        ${sorted.map(a => `
          <div class="assignment ${a.done ? 'done' : ''}">
            <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleAssignment('${subject.id}','${a.id}')">
            <div style="flex:1">
              <span class="title">${escapeHtml(a.title)}</span>
              ${a.dueDate ? `<span class="due ${isOverdue(a.dueDate, a.done) ? 'overdue' : ''}">${isOverdue(a.dueDate, a.done) ? 'Overdue · ' : 'Due '}${formatDate(a.dueDate)}</span>` : ''}
            </div>
            ${canManageChild(activeChild()) ? `<button class="del" onclick="deleteAssignment('${subject.id}','${a.id}')">Remove</button>` : ''}
          </div>
        `).join('') || '<div style="color:var(--ink-soft); font-size:13.5px; padding:6px 0;">No assignments yet.</div>'}
        <div class="add-row" id="addrow-${subject.id}">
          <input type="text" placeholder="New assignment">
          <input type="date">
          <button onclick="handleAddClick('${subject.id}')">Add</button>
        </div>
      </div>
    </div>
  `;
}

function handleAddClick(subjectId) {
  const row = document.getElementById('addrow-' + subjectId);
  const titleInput = row.querySelector('input[type=text]');
  const dateInput = row.querySelector('input[type=date]');
  addAssignment(subjectId, titleInput, dateInput);
}

function renderModal() {
  if (modal.type === 'deleteChild') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Delete ${escapeHtml(modal.name)}?</h3>
          <p style="font-size:13.5px; color:var(--ink-soft); margin:-4px 0 16px;">This removes all their subjects, assignments, and practice log. This can't be undone.</p>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" style="background:var(--coral)" onclick="performDeleteChild()">Delete</button>
          </div>
        </div>
      </div>
    `;
  }
  if (modal.type === 'deleteSubject') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Delete ${escapeHtml(modal.name)}?</h3>
          <p style="font-size:13.5px; color:var(--ink-soft); margin:-4px 0 16px;">This removes all its assignments. This can't be undone.</p>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" style="background:var(--coral)" onclick="performDeleteSubject()">Delete</button>
          </div>
        </div>
      </div>
    `;
  }
  if (modal.type === 'practiceGoal') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Weekly practice goal</h3>
          <div style="display:flex; gap:8px; margin-bottom:6px;">
            <div style="flex:1;">
              <label style="font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;">Minutes per session</label>
              <input type="number" min="1" value="${modal.minutes}" oninput="modal.minutes=this.value" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit;">
            </div>
            <div style="flex:1;">
              <label style="font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;">Times per week</label>
              <input type="number" min="1" value="${modal.timesPerWeek}" oninput="modal.timesPerWeek=this.value" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit;">
            </div>
          </div>
          <p style="font-size:12px; color:var(--ink-soft); margin:6px 0 14px;">Updates this week's remaining practice items to match. Already-completed sessions stay as they are.</p>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveGoalModal()">Save</button>
          </div>
        </div>
      </div>
    `;
  }
  const isChild = modal.type === 'child';
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${isChild ? 'Add a child' : 'Add a subject'}</h3>
        <input type="text" id="modal-name" placeholder="${isChild ? 'Name' : 'Subject name'}" value="${escapeHtml(modal.name)}" oninput="modal.name=this.value">
        <div class="swatches">
          ${COLORS.map(c => `<div class="swatch ${modal.color === c ? 'selected' : ''}" style="background:${c}" onclick="modal.color='${c}'; render(); document.getElementById('modal-name').focus();"></div>`).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveModal()">Save</button>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

</script>
</body>
</html>
